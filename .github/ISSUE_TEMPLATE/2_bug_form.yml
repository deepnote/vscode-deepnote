name: Bug Report Form
description: Same as above, but friendlier. :)
labels: [bug]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting a bug, you may want to check out...
        * Troubleshooting on [our wiki](https://github.com/deepnote/vscode-extension/wiki)
        * Our [Discussions Forum](https://github.com/deepnote/vscode-extension/discussions)
  - type: markdown
    attributes:
      value: |
        ## Bug Form
  - type: checkboxes
    id: feature-focus
    attributes:
      label: Applies To
      options:
        - label: Notebooks (.deepnote files)
        - label: Interactive Window and\/or Cell Scripts (.py files with \#%% markers)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Tell us the steps you took, what you *expected* to happen and what *actually* happened.
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      description: You can copy the contents of Help > About and paste here.
    validations:
      required: true
  - type: input
    id: deepnote-version
    attributes:
      label: Deepnote Extension Version
      description: The version can be found at the top of the extension's description in the extensions sidebar.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Deepnote logs
      description: Copy and paste all of the text in the Deepnote Output panel available via the ```Deepnote Show Output``` command. This is often critical to help us understand and fix what may have gone wrong!
      render: shell
  - type: markdown
    attributes:
      value: |
        ## The following fields are optional but can help us make a better determination of what may have gone wrong.
  - type: input
    id: code-and-runtime
    attributes:
      label: Coding Language and Runtime Version
      placeholder: Python v3.8.2, vJulia 1.6, R, etc.

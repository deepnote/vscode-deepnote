name: Anchor probe

# Throwaway: checks whether GitHub accepts a custom top-level key holding a YAML anchor.
# Never runs on its own. Deleted once the answer is known.
on:
  workflow_dispatch:

x-e2e-groups: &e2e-groups [kernel, files, workspace]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: *e2e-groups
    steps:
      - run: echo "${{ matrix.group }}"

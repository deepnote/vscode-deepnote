name: E2E

# Builds the extension VSIX and runs the ExTester end-to-end suite against it. The VSIX is packaged
# here (same as CD) rather than downloaded from CD, so this workflow is self-contained and triggers
# on the same events as CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the shard list. GitHub Actions does not support YAML anchors, and
  # `env` is not a permitted context inside `strategy`, so a job output is the only way to define the
  # list once and have both the matrix and the verification job read the same value.
  groups:
    name: E2E groups
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.define.outputs.list }}
    steps:
      - name: Define the shard list
        id: define
        run: echo 'list=["kernel","files","workspace"]' >> "$GITHUB_OUTPUT"

  verify-groups:
    name: Verify suite directories
    needs: groups
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # A suite directory missing from the matrix is not a failure on its own — nothing runs it, and
      # the build goes green faster. This is the job that turns that into an error.
      - name: Check every suite directory has a shard
        run: node ./build/e2e/checkSuiteGroups.js
        env:
          E2E_GROUPS: ${{ needs.groups.outputs.list }}

  e2e:
    name: E2E (${{ matrix.group }})
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One shard per directory in test/e2e/suite/, grouped by what the suites cover rather than by
      # measured time, so a new suite has an obvious home and the split does not silently skew as
      # suites are added. The verify-groups job above fails the build if the two ever diverge.
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.groups.outputs.list) }}
    env:
      # Keep ExTester's downloads (test VS Code, ChromeDriver, settings, screenshots) inside the
      # workspace so the artifact-upload paths are predictable. Both this and .test-extensions are
      # gitignored.
      TEST_RESOURCES: ${{ github.workspace }}/test-resources
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Setup Python # interpreter the Deepnote environment is created from
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Package extension
        run: npm run package

      - name: Compile the E2E test sources
        run: npm run compile-e2e

      - name: Install Electron/Chromium runtime libraries + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 libgdk-pixbuf-2.0-0 \
            libgbm1 libasound2t64 libnss3 libnspr4 libxss1 libxshmfence1 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxext6 libxrender1 libpango-1.0-0 \
            libcairo2 libatspi2.0-0 libx11-xcb1 libxcb-dri3-0 libxtst6 libsecret-1-0 \
            libgssapi-krb5-2 libdbus-1-3 libexpat1 python3.12-venv python3-pip

      - name: Download the test VS Code + ChromeDriver
        run: npm run setup:e2e:vscode

      - name: Install the built extension into the test instance
        run: npx extest install-vsix -f vscode-deepnote-insiders.vsix -e .test-extensions

      - name: Install the Python extension into the test instance
        run: npm run setup:e2e:deps

      - name: Cache pip wheel downloads
        # Only the deletion suite still pip-installs at run time (it creates a managed environment
        # on purpose), so this is now a fallback rather than the main lever — see the baked venv
        # below. The key carries github.run_id because actions/cache only writes on a miss: with a
        # bare content hash the entry froze at its first save and the unpinned specs
        # (ipykernel, python-lsp-server, deepnote-cli, all installed with --upgrade) were
        # re-downloaded every run and never written back. restore-keys still resolves to the newest
        # matching entry, so each run starts warm and saves a refreshed copy.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('src/kernels/deepnote/types.ts', 'src/kernels/deepnote/deepnoteToolkitInstaller.node.ts') }}-${{ github.run_id }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('src/kernels/deepnote/types.ts', 'src/kernels/deepnote/deepnoteToolkitInstaller.node.ts') }}-
            pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      - name: Cache the baked Deepnote toolkit venv
        # Every suite that connects a kernel adopts this venv instead of letting the extension build
        # one, which is where most of the old E2E runtime went. Keyed on the resolved Python version
        # as well as the install set: the venv records its base interpreter in pyvenv.cfg, so a
        # patch bump to the hosted Python would leave a restored venv pointing at a path that no
        # longer exists. prepareE2eVenv.js also self-heals — it discards and rebuilds any venv that
        # cannot import deepnote_toolkit.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-e2e
          key: e2e-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('src/kernels/deepnote/types.ts', 'src/kernels/deepnote/deepnoteToolkitInstaller.node.ts') }}

      - name: Bake the Deepnote toolkit venv
        # No-op when the cache restored a usable venv; otherwise creates it and installs the same
        # set deepnoteToolkitInstaller would have.
        run: npm run setup:e2e:venv

      - name: Run E2E
        # VS Code launches with --no-sandbox (no AppArmor sysctl needed). Runs once; Mocha's retries:1
        # and rootHooks.ts (dismiss toasts between tests) handle flakiness in the single shared instance.
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run test:e2e:${{ matrix.group }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: ${{ env.TEST_RESOURCES }}/screenshots/**/*.png
          if-no-files-found: ignore
          retention-days: 14

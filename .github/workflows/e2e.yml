name: E2E

# Builds the extension VSIX and runs the ExTester end-to-end suite against it. The VSIX is packaged
# here (same as CD) rather than downloaded from CD, so this workflow is self-contained and triggers
# on the same events as CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [agent, environments, execution, files, interpreter, workspace]
    env:
      # Keep ExTester's downloads (test VS Code, ChromeDriver, settings, screenshots) inside the
      # workspace so the artifact-upload paths are predictable. Both this and .test-extensions are
      # gitignored.
      TEST_RESOURCES: ${{ github.workspace }}/test-resources
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Setup Python # interpreter the Deepnote environment is created from
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Package extension
        run: npm run package

      - name: Compile the E2E test sources
        run: npm run compile-e2e

      - name: Install Electron/Chromium runtime libraries + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 libgdk-pixbuf-2.0-0 \
            libgbm1 libasound2t64 libnss3 libnspr4 libxss1 libxshmfence1 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxext6 libxrender1 libpango-1.0-0 \
            libcairo2 libatspi2.0-0 libx11-xcb1 libxcb-dri3-0 libxtst6 libsecret-1-0 \
            libgssapi-krb5-2 libdbus-1-3 libexpat1 python3.12-venv python3-pip

      - name: Download the test VS Code + ChromeDriver
        run: npm run setup:e2e:vscode

      - name: Install the built extension into the test instance
        run: npx extest install-vsix -f vscode-deepnote-insiders.vsix -e .test-extensions

      - name: Install the Python extension into the test instance
        run: npm run setup:e2e:deps

      - name: Pre-download the mock LLM server
        # aimock is npx-only (not in lockfile), so setup-node never restores ~/.npm/_npx.
        run: npm run setup:e2e:mock

      - name: Cache pip wheel downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('src/platform/common/toolkitSpec.json', 'src/kernels/deepnote/deepnoteToolkitInstaller.node.ts') }}

      - name: Cache the managed Deepnote toolkit venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-e2e
          key: e2e-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('src/platform/common/toolkitSpec.json', 'src/kernels/deepnote/deepnoteToolkitInstaller.node.ts') }}

      - name: Warm the managed venv
        run: npm run setup:e2e:venv

      - name: Run E2E
        # VS Code launches with --no-sandbox (no AppArmor sysctl needed). Runs once; Mocha's retries:1
        # and rootHooks.ts (dismiss toasts between tests) handle flakiness in the single shared instance.
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run test:e2e:ci
        env:
          E2E_GROUP: ${{ matrix.group }}

      # Written even when the tests fail, so a shard that ran is never mistaken for one that was
      # never scheduled. verify-coverage collects these.
      - name: Record the shard that ran
        if: always()
        run: mkdir -p shard-ran && touch "shard-ran/${{ matrix.group }}"

      - name: Upload the shard record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ran-${{ matrix.group }}
          path: shard-ran/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: ${{ env.TEST_RESOURCES }}/screenshots/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  verify-coverage:
    name: Verify shard coverage
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect what each shard reported
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true
          path: shard-ran
          pattern: e2e-ran-*

      - name: Every suite directory must have been run
        shell: bash
        run: |
          set -uo pipefail
          echo "Shards that reported in: $(find shard-ran -mindepth 1 -maxdepth 1 -printf '%f ' 2>/dev/null)"

          status=0
          for dir in test/e2e/suite/*/; do
            group="$(basename "${dir}")"
            if [ ! -e "shard-ran/${group}" ]; then
              echo "::error::test/e2e/suite/${group}/ was not run by any shard — add it to the matrix in this workflow."
              status=1
            fi
          done

          # A suite outside a group directory is never globbed by any shard either.
          if compgen -G 'test/e2e/suite/*.e2e.test.ts' > /dev/null; then
            echo "::error::Suites sit directly in test/e2e/suite/; move them into a group directory:"
            ls test/e2e/suite/*.e2e.test.ts
            status=1
          fi

          exit "${status}"

name: Verify GitHub Actions lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - run: gh extension install github/gh-actions-lock --pin v0.4.1 && gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

# Qlty Configuration
# Learn more at https://docs.qlty.sh
config_version = "0"

# Exclusion patterns. Must stay above every table header: a bare key after
# `[[plugin]]`/`[[source]]` binds to that table and qlty silently drops it.
exclude_patterns = [
  "node_modules/**",
  "dist/**",
  "coverage/**",
  "**/*.min.js",
  "**/*.min.css",
]

# Plugins configuration
[[plugin]]
name = "actionlint"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "osv-scanner"

# Source configuration
[[source]]
name = "default"
default = true

# Code Smells Configuration
[smells]
mode = "block"

[smells.boolean_logic]
enabled = true
threshold = 4

[smells.nested_control_flow]
enabled = true
threshold = 4

[smells.function_parameters]
enabled = true
threshold = 5

[smells.file_complexity]
enabled = true
threshold = 50

[smells.function_complexity]
enabled = true
threshold = 18

[smells.identical_code]
enabled = true
threshold = 15

[smells.similar_code]
enabled = true
threshold = 15
